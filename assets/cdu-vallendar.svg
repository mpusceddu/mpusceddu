<svg font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CDU Verbandsgemeinde Vallendar</title>
  <desc id="desc">Projektgrafik für den gemeinsamen Internetauftritt der CDU in Vallendar, Niederwerth, Urbar und Weitersburg.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061b2c"/>
      <stop offset="0.62" stop-color="#092a40"/>
      <stop offset="1" stop-color="#0d4855"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a6a6" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#00a6a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020d16" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="132" r="330" fill="url(#glow)"/>
  <circle cx="1140" cy="650" r="270" fill="none" stroke="#00a6a6" stroke-width="72" stroke-opacity="0.12"/>
  <path d="M710 0h170L510 630H340z" fill="#ffffff" opacity="0.025"/>

  <g transform="translate(72 66)">
    <rect width="248" height="76" rx="2" fill="#ffffff"/>
    <g transform="translate(18 17)">
      <path d="M0 42V29c13-2 25-6 36-11v24z" fill="#1b191d"/>
      <path d="M42 42V15c13-6 25-13 36-22v49z" fill="#c8102e"/>
      <path d="M84 42V-11c13-8 25-18 36-29v82z" fill="#ffa600" transform="translate(0 0) scale(.72) translate(0 17)"/>
      <text x="104" y="38" fill="#1b191d" font-size="45" font-weight="700" letter-spacing="-2">CDU</text>
    </g>
  </g>

  <g transform="translate(72 202)">
    <text x="0" y="0" fill="#70dcd7" font-size="18" font-weight="700" letter-spacing="4">GEMEINSAM VOR ORT</text>
    <text x="0" y="83" fill="#ffffff" font-size="66" font-weight="700" letter-spacing="-2">Verbandsgemeinde</text>
    <text x="0" y="167" fill="#ffffff" font-size="66" font-weight="700" letter-spacing="-2">Vallendar</text>
    <text x="2" y="229" fill="#d6e3e7" font-size="25">Vier Orte. Eine gemeinsame Stimme.</text>
  </g>

  <g transform="translate(72 531)" font-size="17" font-weight="700" fill="#ffffff" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="52" fill="#167c84"/>
    <rect x="196" y="0" width="190" height="52" fill="#4b846a"/>
    <rect x="392" y="0" width="190" height="52" fill="#756b48"/>
    <rect x="588" y="0" width="190" height="52" fill="#315e7b"/>
    <text x="20" y="33">Vallendar</text>
    <text x="216" y="33">Niederwerth</text>
    <text x="412" y="33">Urbar</text>
    <text x="608" y="33">Weitersburg</text>
  </g>

  <g transform="translate(1012 511)">
    <circle cx="42" cy="42" r="42" fill="#ffa600"/>
    <path d="M25 42h34M47 29l13 13-13 13" fill="none" stroke="#071f33" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
