    <text x="0" y="135" fill="#ffffff" font-size="100" font-weight="700">vinofy GmbH</text>
    <text x="0" y="232" fill="#dcebed" font-size="37">E-Commerce, Shopify, Strategie und digitale Vorhaben.</text>

    <g transform="translate(0 330)" font-size="25" font-weight="700">
      <g>
        <rect width="210" height="64" rx="32" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.24"/>
        <text x="105" y="42" text-anchor="middle" fill="#ffffff">Beratung</text>
      </g>
      <g transform="translate(230 0)">
