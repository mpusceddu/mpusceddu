<svg font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" xmlns="http://www.w3.org/2000/svg" width="1400" height="735" viewBox="0 0 1400 735" role="img" aria-labelledby="title desc">
  <title id="title">vinofy GmbH – Unternehmenswebsite im Neuaufbau</title>
  <desc id="desc">Projektkarte für E-Commerce-Beratung, Shopify, digitale Vorhaben und zukünftige Beteiligungen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f33"/>
      <stop offset="0.65" stop-color="#08384b"/>
      <stop offset="1" stop-color="#007579"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00121f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1400" height="735" rx="42" fill="url(#bg)"/>
  <circle cx="1250" cy="95" r="290" fill="#ffffff" fill-opacity="0.045"/>
  <circle cx="1180" cy="720" r="360" fill="#75e1dc" fill-opacity="0.055"/>
